services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kstasks}
      POSTGRES_USER: ${DB_USER:-kstasks}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kstasks}
    volumes:
      - ks_tasks_db_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-kstasks} -d ${DB_NAME:-kstasks}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kstasks}
      DB_USER: ${DB_USER:-kstasks}
      DB_PASSWORD: ${DB_PASSWORD:-kstasks}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-32bytes}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5180}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      DOCUMENTS_STORAGE_DIR: ${DOCUMENTS_STORAGE_DIR:-/app/data/documents}
      GIT_REPOS_STORAGE_DIR: ${GIT_REPOS_STORAGE_DIR:-/app/data/git-repos}
      NOTIFY_ROCKETCHAT_BASE_URL: ${NOTIFY_ROCKETCHAT_BASE_URL:-https://chat.tma.com.vn}
      NOTIFY_ROCKETCHAT_TOKEN: ${NOTIFY_ROCKETCHAT_TOKEN:-}
      NOTIFY_ROCKETCHAT_USER_ID: ${NOTIFY_ROCKETCHAT_USER_ID:-}
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN:-}
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    volumes:
      - ks_tasks_documents_data:/app/data/documents
      - ks_tasks_git_repos_data:/app/data/git-repos

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-5180}:80'

volumes:
  ks_tasks_db_data:
  ks_tasks_documents_data:
  ks_tasks_git_repos_data:
