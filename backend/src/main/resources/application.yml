server:
  port: 8080

spring:
  application:
    name: ks-tasks-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kstasks}
    username: ${DB_USER:kstasks}
    password: ${DB_PASSWORD:kstasks}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    cookie-name: ks_token
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  demo:
    code-complete-offset-days: 1
  storage:
    documents-dir: ${DOCUMENTS_STORAGE_DIR:./data/documents}

logging:
  level:
    dev.kstasks: INFO
